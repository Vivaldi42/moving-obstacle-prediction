services:
  python-prototype-x86:
    image: 3dpipe-python:x86
    working_dir: /app
    privileged: true
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - .:/app:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >
      bash -lc "${PYTHON_COMMAND:-python src/rgb_live_stream.py}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  python-prototype-jetson:
    image: 3dpipe-python:jetson
    runtime: nvidia
    working_dir: /app
    privileged: true
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - .:/app:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >
      bash -lc "${PYTHON_COMMAND:-python src/rgb_live_stream.py}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
