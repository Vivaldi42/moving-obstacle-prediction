services:
  perception-x86:
    image: perception:x86
    working_dir: /app
    privileged: true
    gpus: all
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - .:/app:rw
      - /home/vladi/Documents/ZED:/datasets:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - zed-resources-x86:/usr/local/zed/resources
    command: >
      bash -lc "${PYTHON_COMMAND:-python src/evaluate.py}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  perception-jetson:
    image: perception:jetson
    runtime: nvidia
    working_dir: /app
    privileged: true
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - .:/app:rw
      - /home/vladi/Documents/ZED:/datasets:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - zed-resources-jetson:/usr/local/zed/resources
    command: >
      bash -lc "${PYTHON_COMMAND:-python src/evaluate.py}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

volumes:
  zed-resources-x86:
  zed-resources-jetson:
